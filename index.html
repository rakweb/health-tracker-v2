<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Health Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="app-version" content="2.0.0">

    <script>
        (function () {
            const saved = localStorage.getItem('HT_THEME');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
        })();
    </script>

    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/theme-dark.css" />
    <link rel="stylesheet" href="./css/theme-light.css" />
    <link rel="stylesheet" href="./range-slider.css" />

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
</head>
<body>

    <header>
        <div class="wrap headbar">
            <h1>Health Tracker</h1>
            <div>
                <button id="btnAdd" class="btn ok">Add Entry</button>
                <button id="btnSaveCSV" class="btn">Save CSV</button>
                <button id="btnSavePDF" class="btn">Save PDF</button>
                <button id="btnRefresh" class="btn">Refresh</button>
                <button id="btnTheme" class="btn">🌙</button>
            </div>
        </div>
    </header>

    <main class="wrap">
        <div class="card">
            <h2>Metrics Chart</h2>
            <div style="height: 380px;">
                <canvas id="metricsChart"></canvas>
            </div>
        </div>
    </main>

    <!-- Simple Modal -->
    <div id="entryModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:9999; align-items:center; justify-content:center;">
        <div style="background:#121a2a; padding:25px; border-radius:12px; width:90%; max-width:500px;">
            <h2>Add Entry</h2>
            <input type="date" id="f_date" style="width:100%; padding:12px; margin:10px 0;">
            <input type="number" id="f_glucose" placeholder="Glucose" style="width:100%; padding:12px; margin:10px 0;">
            <br><br>
            <button id="btnSaveEntry" class="btn ok">Save</button>
            <button onclick="document.getElementById('entryModal').style.display='none'" class="btn">Cancel</button>
        </div>
    </div>

    <!-- All JS Files -->
    <script src="./range-slider.js"></script>
    <script src="./js/config.js" defer></script>
    <script src="./js/db.js" defer></script>
    <script src="./js/validator.js" defer></script>
    <script src="./js/chart.js" defer></script>
    <script src="./js/worker.js" defer></script>
    <script src="./js/action.js" defer></script>
    <script src="./js/app.js" defer></script>

       <script>
        window.addEventListener('load', () => {
            console.log("%c🚀 Final Binding Active", "color:lime;font-weight:bold");

            // Theme
            const btnTheme = document.getElementById('btnTheme');
            if (btnTheme) {
                btnTheme.addEventListener('click', () => {
                    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                    const next = isDark ? 'light' : 'dark';
                    document.documentElement.setAttribute('data-theme', next);
                    localStorage.setItem('HT_THEME', next);
                    btnTheme.textContent = next === 'dark' ? '☀️' : '🌙';
                });
            }

            // Main Buttons
            const actions = {
                'btnAdd': () => document.getElementById('entryModal').style.display = 'flex',
                'btnSaveEntry': () => Action?.addEntry?.(),
                'btnSaveCSV': () => Action?.exportCSV?.(),
                'btnSavePDF': () => Action?.exportPDF?.(),
                'btnRefresh': () => UI?.refreshTable?.()
            };

            Object.keys(actions).forEach(id => {
                const btn = document.getElementById(id);
                if (btn) {
                    btn.addEventListener('click', actions[id]);
                    console.log(`✅ Button active: ${id}`);
                }
            });

            // Init Chart
            if (typeof ChartManager !== "undefined") {
                setTimeout(() => ChartManager.init(), 400);
            }
        });
    </script>
	
	    <!-- Add Entry Modal -->
    <div id="entryModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:10000; align-items:center; justify-content:center;">
        <div style="background:#121a2a; padding:25px; border-radius:12px; width:90%; max-width:500px;">
            <h2>Add Entry</h2>
            <input type="date" id="f_date" style="width:100%; padding:12px; margin:10px 0;">
            <input type="number" id="f_glucose" placeholder="Glucose mg/dL" style="width:100%; padding:12px; margin:10px 0;">
            <br><br>
            <button id="btnSaveEntry" class="btn ok">Save Entry</button>
            <button onclick="document.getElementById('entryModal').style.display='none'" class="btn">Cancel</button>
        </div>
    </div>
</body>
</html>
</body>
</html>

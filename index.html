<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Health Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="app-version" content="2.0.0">

    <script>
        (function () {
            const saved = localStorage.getItem('HT_THEME');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
        })();
    </script>

    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/theme-dark.css" />
    <link rel="stylesheet" href="./css/theme-light.css" />
    <link rel="stylesheet" href="./range-slider.css" />

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
</head>
<body>

    <header>
        <div class="wrap headbar">
            <h1>Health Tracker</h1>
            <div>
                <button id="btnTheme" class="btn">🌙</button>
            </div>
        </div>
    </header>

    <main class="wrap">
        <!-- Toolbar -->
        <div class="toolbar card">
            <button class="btn" id="btnRefresh">Refresh</button>
            <button class="btn" id="btnSaveCSV">Save CSV</button>
            <button class="btn" id="btnSavePDF">Save PDF</button>
            <button class="btn ok" id="btnAdd">Add Entry</button>
        </div>

        <!-- Table -->
        <div class="card full-width">
            <h2>Entries</h2>
            <table style="width:100%; border-collapse: collapse;">
                <thead>
                    <tr><th>Date</th><th>Glucose</th><th>Time</th></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <!-- Chart -->
        <div class="card full-width">
            <h2>Metrics Chart</h2>
            <div style="height: 380px; position: relative;">
                <canvas id="metricsChart"></canvas>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div id="entryModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:10000; align-items:center; justify-content:center;">
        <div style="background:#121a2a; padding:25px; border-radius:12px; width:90%; max-width:500px;">
            <h2>Add Entry</h2>
            <input type="date" id="f_date" style="width:100%; padding:12px; margin:10px 0;">
            <input type="number" id="f_glucose" placeholder="Glucose mg/dL" style="width:100%; padding:12px; margin:10px 0;">
            <br><br>
            <button id="btnSaveEntry" class="btn ok">Save Entry</button>
            <button onclick="UI.closeEntry()" class="btn">Cancel</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="./range-slider.js"></script>
    <script src="./js/config.js" defer></script>
    <script src="./js/db.js" defer></script>
    <script src="./js/validator.js" defer></script>
    <script src="./js/chart.js" defer></script>
    <script src="./js/worker.js" defer></script>
    <script src="./js/action.js" defer></script>
    <script src="./js/app.js" defer></script>

    <script>
        window.addEventListener('load', () => {
            console.log("🚀 Clean Start - Binding Buttons");

            // Clean binding - one time only
            document.getElementById('btnAdd').addEventListener('click', () => UI.showEntryModal());
            document.getElementById('btnSaveEntry').addEventListener('click', () => Action.addEntry());
            document.getElementById('btnSaveCSV').addEventListener('click', () => Action.exportCSV());
            document.getElementById('btnSavePDF').addEventListener('click', () => Action.exportPDF());
            document.getElementById('btnRefresh').addEventListener('click', () => UI.refreshTable());

            ChartManager.init();
        });
    </script>
</body>
</html>

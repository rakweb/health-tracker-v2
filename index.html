<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Health Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="app-version" content="2.0.0">

    <!-- Theme bootstrap -->
    <script>
        (function () {
            const saved = localStorage.getItem('HT_THEME');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/theme-dark.css" />
    <link rel="stylesheet" href="./css/theme-light.css" />
    <link rel="stylesheet" href="./range-slider.css" />

    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.1.0/dist/chartjs-plugin-annotation.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" defer></script>
</head>
<body>

    <header>
        <div class="wrap headbar">
            <div>
                <h1>Health Tracker</h1>
                <div class="small" id="appVersion"></div>
            </div>
            <div class="install">
                <button id="btnInstall" class="btn" style="display:none">📲 Install</button>
                <button id="btnCheckUpdates" class="btn">Check for updates</button>
                <button id="btnTheme" class="btn" title="Toggle theme">🌙</button>
            </div>
        </div>
    </header>

      <main class="wrap">
        <!-- Toolbar -->
        <div class="toolbar card">
            <div class="row">
                <button class="btn" id="btnRefresh">Refresh</button>
                <button class="btn" id="btnFields">Select Fields</button>
                <button class="btn" id="btnThresholds">Thresholds</button>
                <button class="btn" id="btnSaveCSV">Save CSV</button>
                <button class="btn" id="btnSavePDF">Save PDF</button>
                <button class="btn ok" id="btnAdd">Add Entry</button>
                <button class="btn warn" id="btnOptions">Options</button>
            </div>
        </div>

        <!-- Chart -->
        <div class="card full-width" id="chartCard">
            <canvas id="metricsChart" style="height: 320px; width: 100%;"></canvas>
        </div>
    </main>

    <!-- Minimal Working Modal -->
    <div class="modal-backdrop" id="entryModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); align-items:center; justify-content:center; z-index:100;">
        <div class="modal" style="background:#121a2a; padding:20px; border-radius:12px; width:90%; max-width:600px;">
            <h2>Add Entry</h2>
            <input type="date" id="f_date" style="width:100%; padding:10px; margin:10px 0;">
            <input type="number" id="f_glucose" placeholder="Glucose (mg/dL)" style="width:100%; padding:10px; margin:10px 0;">
            <button class="btn" id="btnSaveEntry">Save Entry</button>
            <button class="btn" onclick="UI.closeEntry()">Close</button>
        </div>
    </div>
    </main>

    <!-- Modals (you can keep your full modal HTML here) -->

     <!-- Scripts -->
    <script src="./range-slider.js"></script>

    <script src="./js/config.js" defer></script>
    <script src="./js/db.js" defer></script>
    <script src="./js/validator.js" defer></script>
    <script src="./js/chart.js" defer></script>
    <script src="./js/worker.js" defer></script>
    <script src="./js/action.js" defer></script>
    <script src="./js/app.js" defer></script>

    <script>
        window.addEventListener('load', () => {
            console.log('🚀 Health Tracker Fully Loaded');

            // Final button bindings
            setTimeout(() => {
                document.getElementById('btnAdd')?.addEventListener('click', () => {
                    document.getElementById('entryModal').style.display = 'flex';
                });

                document.getElementById('btnSaveEntry')?.addEventListener('click', () => {
                    Action.addEntry();
                });

                document.getElementById('btnSaveCSV')?.addEventListener('click', () => Action.exportCSV());
                document.getElementById('btnSavePDF')?.addEventListener('click', () => Action.exportPDF());
                document.getElementById('btnRefresh')?.addEventListener('click', () => UI.refreshTable());
            }, 600);
        });

        // Global helper
        window.UI = {
            closeEntry() {
                document.getElementById('entryModal').style.display = 'none';
            }
        };
    </script>
	
    <!-- Simple Working Modal -->
    <div id="entryModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center;">
        <div style="background:#121a2a; padding:25px; border-radius:12px; width:90%; max-width:520px; border:1px solid #2a3a58;">
            <h2 style="margin-top:0;">Add New Entry</h2>
            
            <label>Date</label>
            <input type="date" id="f_date" style="width:100%; padding:10px; margin:8px 0; background:#0c1426; color:white; border:1px solid #2a3a58; border-radius:8px;">
            
            <label>Glucose (mg/dL)</label>
            <input type="number" id="f_glucose" placeholder="e.g. 98" style="width:100%; padding:10px; margin:8px 0; background:#0c1426; color:white; border:1px solid #2a3a58; border-radius:8px;">
            
            <div style="margin-top:20px;">
                <button id="btnSaveEntry" class="btn ok" style="margin-right:10px;">Save Entry</button>
                <button onclick="UI.closeEntry()" class="btn">Cancel</button>
            </div>
        </div>
    </div>      
</body>
</html>

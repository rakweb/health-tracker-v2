<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Health Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="app-version" content="2.0.0">

    <!-- Theme bootstrap (prevents flash) -->
    <script>
        (function () {
            const saved = localStorage.getItem('HT_THEME');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            window.APP_THEME = theme;
        })();
    </script>

    <!-- CSS -->
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/theme-dark.css" />
    <link rel="stylesheet" href="./css/theme-light.css" />
    <link rel="stylesheet" href="./range-slider.css" />

    <!-- PWA -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.1.0/dist/chartjs-plugin-annotation.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" defer></script>

    <style>
        :root {
            --bg: #0b1220; --panel: #121a2a; --muted: #8aa0c3; --text: #e6eefc;
            --accent: #4ba3ff; --danger: #ff5c5c; --warn: #ffcc66; --ok: #27d79b;
            --ring: #2a3a58; --chip: #1a2440; --btn: #1a2842; --btn-hover: #223152;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif;
            background: linear-gradient(180deg, #0a1120 0%, #0b1220 60%, #0d1322 100%);
            color: var(--text);
        }
        header {
            position: sticky;
            top: 0;
            z-index: 20;
            backdrop-filter: blur(8px);
            background: rgba(9,13,24,0.6);
            border-bottom: 1px solid var(--ring);
        }
        .wrap { max-width: 1200px; margin: 0 auto; padding: 12px 16px; }
        .btn { cursor: pointer; }
        /* Add any extra inline styles you need here */
    </style>
</head>
<body>

    <header>
        <div class="wrap headbar">
            <div>
                <h1>Health Tracker</h1>
                <div class="small" id="appVersion"></div>
            </div>
            <div class="install">
                <button id="btnInstall" class="btn" style="display:none">📲 Install</button>
                <button id="btnCheckUpdates" class="btn">Check for updates</button>
                <button id="btnTheme" class="btn" title="Toggle theme">🌙</button>
            </div>
        </div>
    </header>

    <main class="wrap">
        <!-- === Your existing UI (Toolbar, KPIs, Cards, Modals) === -->
        <!-- Toolbar -->
        <div class="toolbar card"> ... (your full toolbar code) ... </div>

        <!-- KPIs, Risk Alerts, Entries Table, Chart Card, etc. -->
        <!-- (All your existing HTML content from <main> stays here) -->

        <!-- Update Toast -->
        <div id="updateToast" class="toast">
            <span>New version available.</span>
            <button id="btnReloadNow" class="btn ok">Reload now</button>
            <button id="btnDismissToast" class="btn">Later</button>
        </div>

        <!-- All your modals (entry, fields, thresholds, options, bulk remove) remain unchanged -->
    </main>

    <script src="./range-slider.js"></script>
    <script src="./app.js" defer></script>

    <!-- ====================== CORE APP SCRIPTS ====================== -->
    <script>
        let deferredPrompt = null;

        // ============== PWA: Service Worker & Install Prompt ==============
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => console.log('✅ SW registered'))
                    .catch(err => console.error('SW error:', err));
            });
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('btnInstall').style.display = 'inline-block';
        });

        document.getElementById('btnInstall').addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            await deferredPrompt.userChoice;
            deferredPrompt = null;
            document.getElementById('btnInstall').style.display = 'none';
        });

        // ============== Version Display ==============
        window.addEventListener('load', () => {
            const version = document.querySelector('meta[name="app-version"]').content;
            document.getElementById('appVersion').textContent = `Version ${version}`;
        });

        // ============== Theme Toggle ==============
        const btnTheme = document.getElementById('btnTheme');
        function updateThemeIcon() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            btnTheme.textContent = isDark ? '☀️' : '🌙';
        }

        btnTheme.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('HT_THEME', next);
            updateThemeIcon();
        });

        // Initialize icon
        updateThemeIcon();

        // ============== PDF Light Mode Handler ==============
        document.getElementById('btnSavePDF')?.addEventListener('click', () => {
            const root = document.documentElement;
            root.setAttribute('data-pdf-export', '1');

            setTimeout(() => {
                root.removeAttribute('data-pdf-export');
            }, 2500); // Adjust if your PDF generation takes longer
        }, true);

        // ============== Update Toast ==============
        function showUpdateToast() {
            const toast = document.getElementById('updateToast');
            if (toast) toast.classList.add('show');
        }

        document.getElementById('btnReloadNow')?.addEventListener('click', () => location.reload());
        document.getElementById('btnDismissToast')?.addEventListener('click', () => {
            document.getElementById('updateToast').classList.remove('show');
        });

        // ============== Consolidated Chart Theme Handler ==============
        function applyChartTheme() {
            if (!window.Chart) return;

            const root = document.documentElement;
            const isLight = root.getAttribute('data-theme') === 'light' || 
                           root.getAttribute('data-pdf-export') === '1';

            const textColor = isLight ? '#0a1220' : '#e6eefc';
            const mutedColor = isLight ? '#2b3d57' : '#8aa0c3';
            const gridColor = isLight ? 'rgba(10,18,32,0.16)' : 'rgba(230,238,252,0.14)';

            // Global defaults
            Chart.defaults.color = textColor;
            Chart.defaults.plugins.legend.labels.color = mutedColor;
            Chart.defaults.plugins.tooltip.titleColor = textColor;
            Chart.defaults.plugins.tooltip.bodyColor = textColor;

            Chart.defaults.scale.ticks.color = mutedColor;
            Chart.defaults.scale.grid.color = gridColor;

            // Update existing chart
            const chart = Chart.getChart('metricsChart');
            if (chart) {
                // Apply to this chart
                if (chart.options.plugins?.legend?.labels) chart.options.plugins.legend.labels.color = mutedColor;
                if (chart.options.scales) {
                    Object.keys(chart.options.scales).forEach(key => {
                        const scale = chart.options.scales[key];
                        if (scale.ticks) scale.ticks.color = mutedColor;
                        if (scale.grid) scale.grid.color = gridColor;
                    });
                }
                chart.update();
            }
        }

        // Apply chart theme when ready
        window.addEventListener('load', () => {
            let attempts = 0;
            const interval = setInterval(() => {
                applyChartTheme();
                if (window.Chart?.getChart?.('metricsChart') || attempts++ > 50) {
                    clearInterval(interval);
                }
            }, 80);
        });

        // Re-apply on theme / PDF changes
        new MutationObserver(applyChartTheme)
            .observe(document.documentElement, {
                attributes: true,
                attributeFilter: ['data-theme', 'data-pdf-export']
            });
    </script>
</body>
</html>

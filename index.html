<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Health Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="app-version" content="2.0.0">

    <!-- Theme bootstrap -->
    <script>
        (function () {
            const saved = localStorage.getItem('HT_THEME');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/theme-dark.css" />
    <link rel="stylesheet" href="./css/theme-light.css" />
    <link rel="stylesheet" href="./range-slider.css" />

    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.1.0/dist/chartjs-plugin-annotation.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" defer></script>
</head>
<body>

    <header>
        <div class="wrap headbar">
            <div>
                <h1>Health Tracker</h1>
                <div class="small" id="appVersion"></div>
            </div>
            <div class="install">
                <button id="btnInstall" class="btn" style="display:none">📲 Install</button>
                <button id="btnCheckUpdates" class="btn">Check for updates</button>
                <button id="btnTheme" class="btn" title="Toggle theme">🌙</button>
            </div>
        </div>
    </header>

    <main class="wrap">
        <!-- Toolbar -->
        <div class="toolbar card">
            <div class="row">
                <div><label>From Date</label><input type="date" id="filterStart"></div>
                <div><label>To Date</label><input type="date" id="filterEnd"></div>
                <div>
                    <label>Chart Metrics</label>
                    <select id="chartMetrics" multiple size="4"></select>
                </div>
                <div>
                    <label>View</label>
                    <select id="viewMode">
                        <option value="both" selected>Both</option>
                        <option value="table">Table only</option>
                        <option value="chart">Chart only</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <button class="btn" id="btnRefresh">Refresh</button>
                <button class="btn" id="btnFields">Select Fields</button>
                <button class="btn" id="btnThresholds">Thresholds</button>
                <button class="btn" id="btnSaveCSV">Save CSV</button>
                <button class="btn" id="btnSavePDF">Save PDF</button>
                <button class="btn" id="btnImportCSV">Import CSV</button>
                <button class="btn ok" id="btnAdd">Add Entry</button>
                <button class="btn warn" id="btnOptions">Options</button>
            </div>
        </div>

        <!-- KPIs, Cards, etc. (shortened for brevity - add your full content here if needed) -->
        <div class="kpis">...</div>
        <div class="card full-width" id="entriesCard">...</div>
        <div class="card full-width" id="chartCard">
            <canvas id="metricsChart" style="height:320px"></canvas>
        </div>
    </main>

    <!-- Modals (you can keep your full modal HTML here) -->

    <!-- Scripts -->
    <script src="./range-slider.js"></script>

    <script src="./js/config.js" defer></script>
    <script src="./js/db.js" defer></script>
    <script src="./js/validator.js" defer></script>
    <script src="./js/chart.js" defer></script>
    <script src="./js/worker.js" defer></script>
    <script src="./js/action.js" defer></script>
    <script src="./js/app.js" defer></script>

    <!-- DIRECT BUTTON FIX -->
    <script>
        function bindButtons() {
            console.log("🔧 Binding buttons directly...");

            const buttons = {
                'btnAdd': () => { console.log("Add Entry clicked"); document.getElementById('entryModal').classList.add('show'); },
                'btnSaveEntry': () => { console.log("Save Entry clicked"); Action?.addEntry(); },
                'btnSaveCSV': () => { console.log("Save CSV clicked"); Action?.exportCSV(); },
                'btnSavePDF': () => { console.log("Save PDF clicked"); Action?.exportPDF(); },
                'btnRefresh': () => { console.log("Refresh clicked"); UI?.refreshTable(); },
                'btnFields': () => { console.log("Fields clicked"); },
                'btnThresholds': () => { console.log("Thresholds clicked"); },
                'btnOptions': () => { console.log("Options clicked"); }
            };

            Object.keys(buttons).forEach(id => {
                const btn = document.getElementById(id);
                if (btn) {
                    // Remove old listeners first
                    btn.replaceWith(btn.cloneNode(true));
                    const freshBtn = document.getElementById(id);
                    freshBtn.addEventListener('click', buttons[id]);
                    console.log(`✅ Button ACTIVE: #${id}`);
                } else {
                    console.warn(`❌ Button MISSING: #${id}`);
                }
            });
        }

        // Run after everything loads
        window.addEventListener('load', () => {
            console.log('🚀 Health Tracker Fully Loaded');
            setTimeout(bindButtons, 800);   // Give time for all modules
        });
    </script>
</body>
</html>

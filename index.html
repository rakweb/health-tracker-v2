<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Health Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="app-version" content="2.0.0">

    <script>
        (function () {
            const saved = localStorage.getItem('HT_THEME');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
        })();
    </script>

    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/theme-dark.css" />
    <link rel="stylesheet" href="./css/theme-light.css" />
    <link rel="stylesheet" href="./range-slider.css" />

    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon-192.png" />

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
</head>
<body>

    <header>
        <div class="wrap headbar">
            <div>
                <h1>Health Tracker</h1>
                <div class="small" id="appVersion"></div>
            </div>
            <div>
                <button id="btnInstall" class="btn" style="display:none">Install</button>
                <button id="btnTheme" class="btn">🌙</button>
            </div>
        </div>
    </header>

    <main class="wrap">
        <!-- Toolbar with ALL buttons -->
        <div class="toolbar card">
            <div class="row">
                <button class="btn" id="btnRefresh">Refresh</button>
                <button class="btn" id="btnFields">Select Fields</button>
                <button class="btn" id="btnThresholds">Thresholds</button>
                <button class="btn" id="btnSaveCSV">Save CSV</button>
                <button class="btn" id="btnSavePDF">Save PDF</button>
                <button class="btn ok" id="btnAdd">Add Entry</button>
                <button class="btn warn" id="btnOptions">Options</button>
            </div>
        </div>

        <!-- Chart Area -->
        <div class="card full-width" id="chartCard">
            <canvas id="metricsChart" style="height: 340px; width:100%;"></canvas>
        </div>
    </main>

    <!-- Working Modal -->
    <div id="entryModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:10000; align-items:center; justify-content:center;">
        <div style="background:#121a2a; padding:25px; border-radius:12px; width:90%; max-width:500px; border:1px solid #2a3a58;">
            <h2>Add Entry</h2>
            <input type="date" id="f_date" style="width:100%; padding:12px; margin:10px 0; background:#0c1426; color:white; border:1px solid #35507f; border-radius:8px;">
            <input type="number" id="f_glucose" placeholder="Glucose mg/dL" style="width:100%; padding:12px; margin:10px 0; background:#0c1426; color:white; border:1px solid #35507f; border-radius:8px;">
            
            <div style="margin-top:20px; display:flex; gap:10px;">
                <button id="btnSaveEntry" class="btn ok">Save Entry</button>
                <button onclick="closeModal()" class="btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="./range-slider.js"></script>
    <script src="./js/config.js" defer></script>
    <script src="./js/db.js" defer></script>
    <script src="./js/validator.js" defer></script>
    <script src="./js/chart.js" defer></script>
    <script src="./js/worker.js" defer></script>
    <script src="./js/action.js" defer></script>
    <script src="./js/app.js" defer></script>

    <script>
        window.addEventListener('load', () => {
            console.log('🚀 Health Tracker Ready');

            // Direct button binding
            document.getElementById('btnAdd').addEventListener('click', () => {
                document.getElementById('entryModal').style.display = 'flex';
            });

            document.getElementById('btnSaveEntry').addEventListener('click', () => {
                Action.addEntry();
            });

            document.getElementById('btnSaveCSV').addEventListener('click', () => Action.exportCSV());
            document.getElementById('btnSavePDF').addEventListener('click', () => Action.exportPDF());
            document.getElementById('btnRefresh').addEventListener('click', () => UI.refreshTable());
        });

        function closeModal() {
            document.getElementById('entryModal').style.display = 'none';
        }

        window.closeModal = closeModal;
    </script>
</body>
</html>
